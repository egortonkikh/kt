services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      - CONNECTION_STRING=postgresql://postgres:1234@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: